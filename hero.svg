<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440" fill="none"
     font-family="Inter, system-ui, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eff6ff"/>
      <stop offset="1" stop-color="#e0e7ff"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0f172a" flood-opacity=".10"/>
    </filter>
  </defs>

  <!-- Background -->
  <circle cx="290" cy="220" r="205" fill="url(#bg)"/>

  <!-- Dashboard window -->
  <rect x="60" y="70" width="400" height="290" rx="16" fill="#fff" filter="url(#sh)"/>
  <path d="M60 86 a16 16 0 0 1 16 -16 h368 a16 16 0 0 1 16 16 v24 h-400 z" fill="#f8fafc"/>
  <circle cx="84" cy="90" r="5" fill="#fca5a5"/>
  <circle cx="100" cy="90" r="5" fill="#fcd34d"/>
  <circle cx="116" cy="90" r="5" fill="#86efac"/>
  <line x1="60" y1="110" x2="460" y2="110" stroke="#e5e7eb"/>

  <!-- Summary bar -->
  <rect x="84" y="126" width="352" height="32" rx="8" fill="#fef2f2"/>
  <text x="98" y="146" font-size="11" font-weight="600" fill="#991b1b">High risk: 1 overpriced quote, 2 linked vendors</text>

  <!-- Table header -->
  <text x="98" y="182" font-size="9" font-weight="600" fill="#94a3b8" letter-spacing=".8">VENDOR</text>
  <text x="200" y="182" font-size="9" font-weight="600" fill="#94a3b8" letter-spacing=".8">UNIT PRICE</text>
  <text x="300" y="182" font-size="9" font-weight="600" fill="#94a3b8" letter-spacing=".8">RISK FLAGS</text>

  <!-- Row 1 -->
  <rect x="84" y="192" width="352" height="42" rx="8" fill="#f8fafc"/>
  <text x="98" y="217" font-size="12" font-weight="600" fill="#0f172a">Vendor A</text>
  <text x="200" y="217" font-size="12" fill="#334155">$3,900</text>
  <rect x="300" y="203" width="78" height="20" rx="10" fill="#fef2f2"/>
  <text x="339" y="217" font-size="10" font-weight="600" fill="#dc2626" text-anchor="middle">Price 3.2×</text>

  <!-- Row 2 (selected) -->
  <rect x="84" y="242" width="352" height="42" rx="8" fill="#eff6ff"/>
  <rect x="84" y="242" width="4" height="42" rx="2" fill="#2563eb"/>
  <text x="98" y="267" font-size="12" font-weight="600" fill="#0f172a">Vendor B</text>
  <text x="200" y="267" font-size="12" fill="#334155">$1,150</text>
  <rect x="300" y="253" width="74" height="20" rx="10" fill="#fef2f2"/>
  <text x="337" y="267" font-size="10" font-weight="600" fill="#dc2626" text-anchor="middle">Collusion</text>

  <!-- Row 3 -->
  <rect x="84" y="292" width="352" height="42" rx="8" fill="#f8fafc"/>
  <text x="98" y="317" font-size="12" font-weight="600" fill="#0f172a">Vendor D</text>
  <text x="200" y="317" font-size="12" fill="#334155">$1,210</text>
  <rect x="300" y="303" width="52" height="20" rx="10" fill="#f0fdf4"/>
  <text x="326" y="317" font-size="10" font-weight="600" fill="#15803d" text-anchor="middle">Clear</text>

  <!-- Floating card: collusion alert -->
  <rect x="330" y="30" width="200" height="62" rx="12" fill="#fff" filter="url(#sh)"/>
  <circle cx="356" cy="61" r="14" fill="#fef2f2"/>
  <text x="356" y="66" font-size="15" font-weight="700" fill="#dc2626" text-anchor="middle">!</text>
  <text x="378" y="56" font-size="11" font-weight="700" fill="#0f172a">Collusion detected</text>
  <text x="378" y="73" font-size="10" fill="#64748b">Vendor B and C share a bank</text>

  <!-- Floating card: officer approved -->
  <rect x="24" y="330" width="196" height="62" rx="12" fill="#fff" filter="url(#sh)"/>
  <circle cx="50" cy="361" r="14" fill="#f0fdf4"/>
  <path d="M43 361 l5 5 l9 -10" stroke="#15803d" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="72" y="356" font-size="11" font-weight="700" fill="#0f172a">Officer approved</text>
  <text x="72" y="373" font-size="10" fill="#64748b">Decision logged for audit</text>
</svg>